server.port=9000


# Supabase config
# Example:
# supabase.url=https://your-project-ref.supabase.co
# supabase.anon-key=your-anon-key
# supabase.service-role-key=your-service-role-key
supabase.url=
supabase.anon-key=
supabase.service-role-key=

# Supabase Postgres connection (replace password)
# host: db.qkfndglocfuzsjxlqkpl.supabase.co
# port: 5432
# database: postgres
# user: postgres
# postgresql://postgres:[YOUR-PASSWORD]@db.qkfndglocfuzsjxlqkpl.supabase.co:5432/postgres


# MyBatis + Supabase Postgres
# Set SUPABASE_DB_PASSWORD in environment before running.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.qkfndglocfuzsjxlqkpl.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=0
mybatis.configuration.map-underscore-to-camel-case=true



